name: ConvertKit weekly health

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run weekly production health check
        id: health
        continue-on-error: true
        env:
          SITE_URL: https://lovexiaoyue.cc.cd
        run: pnpm run health:weekly artifacts/weekly-health/health-check.md
      - name: Publish report to job summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/weekly-health/health-check.md ]; then
            cat artifacts/weekly-health/health-check.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Health report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload weekly health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convertkit-weekly-health-${{ github.run_id }}
          path: artifacts/weekly-health/health-check.md
          if-no-files-found: error
          retention-days: 90
      - name: Fail when health check needs review
        if: steps.health.outcome == 'failure'
        run: exit 1
