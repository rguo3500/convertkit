name: ConvertKit quality

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate conversion data
        run: pnpm run validate:conversions
      - name: Run unit tests
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          pnpm run test 2>&1 | tee /tmp/convertkit-test.log
          status=${PIPESTATUS[0]}
          end=$(date +%s)
          echo "test_duration=$((end-start))s" > /tmp/convertkit-timing.log
          exit "$status"
      - name: Typecheck
        run: pnpm run check
      - name: Build
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          VITE_SITE_URL=https://convertkit.example pnpm run build 2>&1 | tee /tmp/convertkit-build.log
          status=${PIPESTATUS[0]}
          end=$(date +%s)
          echo "build_duration=$((end-start))s" >> /tmp/convertkit-timing.log
          exit "$status"
      - name: Start preview server for accessibility audit
        run: |
          pnpm run dev -- --host 127.0.0.1 > /tmp/convertkit-vite.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
      - name: axe accessibility audit
        run: pnpm run audit:a11y
      - name: Lighthouse CI
        run: pnpm run audit
      - name: Summarize Lighthouse scores
        if: always()
        run: pnpm run audit:summary
      - name: Check Lighthouse regression thresholds
        if: always()
        run: pnpm run audit:regression
      - name: Manage Lighthouse exception reminder
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          LIGHTHOUSE_ISSUE_ASSIGNEE: ${{ vars.LIGHTHOUSE_ISSUE_ASSIGNEE }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- convertkit-lighthouse-exception-reminder -->';
            const path = 'artifacts/summary/lighthouse-exception-reminders.txt';
            const report = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : '';
            const hasReminder = report && !report.includes('No Lighthouse exceptions expire within 30 days.');
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
            const labels = ['quality-check', 'maintenance'];
            const assignee = (process.env.LIGHTHOUSE_ISSUE_ASSIGNEE || '').trim().replace(/^@/, '');
            const previousOwner = existing?.body?.match(/Owner: @([A-Za-z0-9-]+)/)?.[1] || '';
            const historyMatch = existing?.body?.match(/## Owner history\n([\s\S]*?)(?:\n##|$)/);
            const ownerHistory = historyMatch?.[1]?.trim() || '';
            const ownerChanged = assignee && assignee !== previousOwner;
            const historyEntry = ownerChanged
              ? `- ${new Date().toISOString()}: ${previousOwner ? `@${previousOwner}` : 'unassigned'} → @${assignee}`
              : '';
            const nextOwnerHistory = [ownerHistory, historyEntry].filter(Boolean).join('\n');
            const mention = assignee ? `\n\nOwner: @${assignee}` : '';
            if (hasReminder) {
              for (const name of labels) {
                try { await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name }); }
                catch { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color: name === 'quality-check' ? '1D56C9' : 'FBCA04' }); }
              }
              const body = `${marker}\n## ConvertKit Lighthouse exception reminder\n\nReview the expiring exception rules in the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) and uploaded quality artifact.${mention}\n\n## Owner history\n${nextOwnerHistory || '- No owner change recorded.'}\n\n\`\`\`text\n${report}\n\`\`\``;
              if (existing) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body, labels });
              else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: '[ConvertKit] Lighthouse exceptions need review', body, labels });
            } else if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `No Lighthouse exception expires within 30 days in [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
            }
      - name: Capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/failures
          {
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            date -u
          } > artifacts/failures/run-info.txt
          if [ -f /tmp/convertkit-vite.log ]; then
            cp /tmp/convertkit-vite.log artifacts/failures/vite.log
          fi
          for route in / /format-converters /batch-converter; do
            name=$(echo "$route" | tr '/-' '__')
            curl -L --max-time 20 -sS -D "artifacts/failures/${name}.headers" \
              -o "artifacts/failures/${name}.html" "http://127.0.0.1:3000$route" || true
          done
          browser=""
          for candidate in chromium chromium-browser google-chrome; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$candidate"; break; fi
          done
          if [ -n "$browser" ]; then
            "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1440,1200 --screenshot=artifacts/failures/home.png \
              http://127.0.0.1:3000/ || true
          fi

      - name: Create quality summary
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/summary
          {
            echo "job_status=${{ job.status }}"
            if [ -f /tmp/convertkit-test.log ]; then grep -E 'Tests +[0-9]+ passed|Test Files +[0-9]+ passed' /tmp/convertkit-test.log || true; fi
            if [ -f /tmp/convertkit-timing.log ]; then cat /tmp/convertkit-timing.log; fi
            if [ -f artifacts/summary/lighthouse-summary.md ]; then
              echo ""
              cat artifacts/summary/lighthouse-summary.md
            fi
            if [ -f artifacts/summary/lighthouse-regression.txt ]; then
              echo ""
              cat artifacts/summary/lighthouse-regression.txt
            fi
            if [ -f artifacts/summary/lighthouse-exception-reminders.txt ]; then
              echo ""
              cat artifacts/summary/lighthouse-exception-reminders.txt
            fi
          } > artifacts/summary/quality-summary.txt

      - name: Upload accessibility, Lighthouse, and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convertkit-quality-reports-${{ github.run_id }}
          path: |
            artifacts/axe/ci/
            artifacts/lighthouse/
            artifacts/failures/
            artifacts/summary/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment quality summary on Pull Request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- convertkit-quality-summary -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const status = process.env.JOB_STATUS === 'success' ? 'passed' : 'failed';
            const summaryPath = 'artifacts/summary/quality-summary.txt';
            const summary = fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8').trim() : 'Summary unavailable';
            const body = `${marker}\n## ConvertKit quality check ${status}\n\nCommit: ${context.sha.slice(0, 7)}\n\n\`\`\`text\n${summary}\n\`\`\`\n\n- Full run: [workflow details](${runUrl})\n- Reports artifact: convertkit-quality-reports-${context.runId}\n- Failure diagnostics are included automatically when a step fails\n\nThis comment is updated on subsequent runs for the same Pull Request.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
