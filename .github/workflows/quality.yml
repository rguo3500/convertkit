name: ConvertKit quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate conversion data
        run: pnpm run validate:conversions
      - name: Run unit tests
        run: pnpm run test
      - name: Typecheck
        run: pnpm run check
      - name: Build
        run: VITE_SITE_URL=https://convertkit.example pnpm run build
      - name: Start preview server for accessibility audit
        run: |
          pnpm run dev -- --host 127.0.0.1 > /tmp/convertkit-vite.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
      - name: axe accessibility audit
        run: pnpm run audit:a11y
      - name: Lighthouse CI
        run: pnpm run audit
